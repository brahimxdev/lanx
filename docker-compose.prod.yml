services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    command: node dist/server.js

    ports:
      - "3000:3000"

    env_file:
      - .env.production

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: node dist/worker.js

    env_file:
      - .env.production

    restart: unless-stopped
