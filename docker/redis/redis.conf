# Persistence
# AOF (Append Only File) - log every write command
# Survives container restarts, more durable than RDB snapshots
appendonly yes
appendfilename "appendonly.aof"

# flush to disk every second (good balance)
appendfsync everysec

# Memory
# Cap memory at 256mb for local dev
# In production Railway manages this - remove or increase as needed
maxmemory 256mb

# When memory is full, evict least recently used keys
# allkeys-lru = evict any key (not just TTL ones) - good for cache use cases
maxmemory-policy allkeys-lru

# Networking
# Bind to all interfaces so the app container can connect
# (Docker networking handles the actual isolation)
bind 0.0.0.0

# Default port
port 6379

# Logging
# notice = only important events logged (not noisy)
loglevel notice

# Performance
# Disable saving RDB snapshots - we use AOF only
# (Two persistence mechanisms at once is redundant in dev)
save ""

# TCP keepalive - detect dead connections
tcp-keepalive 60
