# Persistence — same reasoning as the cache instance: AOF survives
# container restarts and is more durable than RDB snapshots.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory
# Modest cap for local dev — this instance only holds job queue data,
# not app cache, so it doesn't need to be large. Increase for local
# load-testing if you're ever pushing serious job volume through it.
maxmemory 128mb

# Jobs are not disposable the way cache entries are: losing an enqueued
# or in-flight job under memory pressure means a proposal doesn't send,
# an expiry sweep doesn't run — silently, with no error anywhere. So
# instead of evicting to make room, Redis should refuse new writes and
# surface an OOM error, which is loud and debuggable instead of silent.
maxmemory-policy noeviction

# Networking — same as the cache instance.
bind 0.0.0.0
port 6379

loglevel notice
save ""
tcp-keepalive 60
