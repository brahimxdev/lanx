info:
  name: create profile
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/profile"
  body:
    type: json
    data: |-
      {
        "firstName": "lekxy", 
        "lastName": "ola", 
        "businessName": "lek inc",
        "professionId": "08b058cd-c77f-4633-a59f-e38e76ff3033",
        "countryCode": "US",
        "currencyCode": "USD"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
