info:
  name: list countries
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/countries?sortBy=name&sortOrder=asc"
  params:
    - name: sortBy
      value: name
      type: query
    - name: sortOrder
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
