info:
  name: list professions
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/lookup/professions?search=backend&limit=20&page=1&sortBy=name&sortOrder=asc"
  params:
    - name: search
      value: backend
      type: query
    - name: limit
      value: "20"
      type: query
    - name: page
      value: "1"
      type: query
    - name: sortBy
      value: name
      type: query
    - name: sortOrder
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
