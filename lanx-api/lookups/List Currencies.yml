info:
  name: List Currencies
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/lookup/currencies?sortBy=code&sortOrder=asc"
  params:
    - name: sortBy
      value: code
      type: query
    - name: sortOrder
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
