info:
  name: Create Proposal
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/proposals"
  body:
    type: json
    data: |-
      {
        "clientId": "{{clientId}}",
        "title": "Cloud Management",
        "description": "Proposal for managing cloud",
        "currencyCode": "CAD",
        "discountType": "fixed",
        "discountFixedValue": 20,
        "discountPercentageValue": 20,
        "lineItems": [
          {
            "description": "AWS",
            "quantity": 2,
            "unitPrice": 400
          },
          {
            "description": "Google Cloud",
            "quantity": 4,
            "unitPrice": 1000
          },
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
