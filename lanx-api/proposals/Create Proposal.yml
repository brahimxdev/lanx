info:
  name: Create Proposal
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/proposals"
  body:
    type: json
    data: |-
      {
        "clientId": "{{clientId}}",
        "title": "Website Development Proposal",
        "description": "Proposal for designing and developing a company website.",
        "currencyCode": "USD",
        "discountType": "percentage",
      //   "discountFixedValue": 20,
        "discountPercentageValue": 20,
        "lineItems": [
          {
            "description": "UI/UX Design",
            "quantity": 4,
            "unitPrice": 100
          },
          {
            "description": "Frontend Development",
            "quantity": 2,
            "unitPrice": 100
          },
          {
            "description": "Backend Development",
            "quantity": 3,
            "unitPrice": 100
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
