info:
  name: List Clients
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/clients?page=1&limit=30&sortBy=createdAt&sortOrder=desc&isIncludedArchived=false&search=johnrrr"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "30"
      type: query
    - name: sortBy
      value: createdAt
      type: query
    - name: sortOrder
      value: desc
      type: query
    - name: isIncludedArchived
      value: "false"
      type: query
    - name: search
      value: johnrrr
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
