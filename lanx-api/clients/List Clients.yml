info:
  name: List Clients
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/clients?page=1&limit=30&sortBy=firstName&sortOrder=asc&isIncludedArchived=true&sortBy=lastName"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "30"
      type: query
    - name: sortBy
      value: firstName
      type: query
    - name: sortOrder
      value: asc
      type: query
    - name: isIncludedArchived
      value: "true"
      type: query
    - name: search
      value: jane.doe@example.com
      type: query
      disabled: true
    - name: sortBy
      value: lastName
      type: query
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
