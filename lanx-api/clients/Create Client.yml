  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const clientId = body?.data?.newClient?.id;

        if (clientId) {
          bru.setEnvVar("clientId", clientId);
        } else {
          console.log("ClientId setting failed");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
