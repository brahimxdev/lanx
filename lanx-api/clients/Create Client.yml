info:
  name: Create Client
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/clients"
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Doe", 
        "email": "jennifer@email.com", 
        "companyName": "Jane Doe Inc",
        "notes": "Working on creating API for them"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const clientId = body?.data?.newClient?.id;

        if (clientId) {
          bru.setEnvVar("clientId", clientId);
        } else {
          console.log("ClientId setting failed");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
